[project]
name = "prospecter"
version = "0.1.0"
description = "Multi-agent B2B lead prospector over the French SIRENE registry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph Tartivel" }]
license = { text = "MIT" }

dependencies = [
    # LiteLLM gives us a single client that speaks Anthropic, OpenAI,
    # DeepSeek, Mistral, vLLM, etc. The agent code stays provider-agnostic;
    # we ablate across providers in the eval.
    "litellm>=1.55",
    "langgraph>=0.2.50",
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    # Observability — LiteLLM forwards `metadata` to the Langfuse callback when
    # registered. Toggle via LANGFUSE_ENABLED; absent keys make the wrapper a no-op.
    # Pinned <3 because LiteLLM's integration still imports `langfuse.version`,
    # which v3 renamed to `langfuse._version`. Bump when LiteLLM ships v3 support.
    "langfuse>=2.50,<3",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.scripts]
prospecter = "prospecter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospecter"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `_handoff/` contains drop-in code that sessions adapt and `git rm` once
# consumed. It's staging, not production. Linting it is theater.
extend-exclude = ["_handoff"]

[tool.ruff.lint]
# Conservative defaults. Add rules deliberately, not by copying every recipe online.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length is enforced by formatter, not linter
    "B008",  # typer.Option(...) and typer.Argument(...) in defaults is THE
             # documented typer pattern — it's how the CLI structure gets
             # parsed at import time. Same applies to FastAPI Depends() and
             # pytest fixture(). Industry-standard ignore for typer projects.
]

[tool.pyright]
include = ["src", "eval", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:langsmith disables the langsmith pytest plugin which hangs on import
# under Python 3.14. Langsmith is a transitive dep of litellm; we don't use
# its tracing here.
addopts = "-q -p no:langsmith"
# auto-mark async test functions; saves a `@pytest.mark.asyncio` per test
asyncio_mode = "auto"
